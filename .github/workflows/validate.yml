name: Validate Guess Arcade

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check guessingGame.js
          node --check server.js
          node --check service-worker.js
      - name: JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s guessingGame.js
          test -s netlify.toml
